<script>
(function(){
  var API_BASE = (window.location.protocol==='http:'||window.location.protocol==='https:') ? window.location.origin : 'http://localhost:3000';
  function genId(){return 's_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);}
  function getSession(){
    try{
      var s=localStorage.getItem('axis_session');
      if(!s){s=genId();localStorage.setItem('axis_session',s);}
      return s;
    }catch(_){return genId();}
  }
  var form=document.getElementById('form-personal');
  var alertBox=document.getElementById('apply-alert');
  function showAlert(msg,kind){
    if(!alertBox)return;
    alertBox.textContent=msg;
    alertBox.style.display='block';
    alertBox.className='apply-alert '+(kind||'');
    if(kind==='error'){alertBox.style.background='#fdecea';alertBox.style.color='#c0392b';alertBox.style.border='1px solid #f5c6c0';}
    else{alertBox.style.background='#e6f4ea';alertBox.style.color='#1e7e34';alertBox.style.border='1px solid #b7e4c2';}
  }
  if(form){
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var btn=form.querySelector('button[type=submit]');
      if(btn&&btn.disabled)return;
      var data={
        full_name:document.getElementById('full_name').value,
        mobile:document.getElementById('mobile').value,
        email:document.getElementById('email').value,
        dob:document.getElementById('dob').value
      };
      for(var k in data){
        if(!data[k]||!String(data[k]).trim()){showAlert('Please fill in all fields.','error');return;}
      }
      if(btn){btn.disabled=true;var orig=btn.textContent;btn.textContent='Submitting...';}
      fetch(API_BASE+'/api/submit',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionId:getSession(),step:'personal',data:data})
      }).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if(res.ok){window.location.href='/card';}
        else{showAlert(res.j&&res.j.error?res.j.error:'Submission failed. Please try again.','error');if(btn){btn.disabled=false;btn.textContent=orig;}}
      })
      .catch(function(){showAlert('Network error. Please check your connection and try again.','error');if(btn){btn.disabled=false;btn.textContent=orig;}});
    });
  }
})();
</script>
